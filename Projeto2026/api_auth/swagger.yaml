openapi: 3.0.0
info:
  title: API de Autenticação e Gestão de Utilizadores
  description: Serviço para registo, login, logout e gestão de utilizadores para a aplicação DianaDecor.
  version: 1.0.0

servers:
  - url: http://localhost:7791
    description: Servidor de Autenticação 

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    queryAuth:
      type: apiKey
      in: query
      name: token  # O nome do parâmetro que o teu middleware procura (?token=...)

  schemas:
    User:
      type: object
      required:
        - _id
        - nome
        - email
        - telefone
        - passwordHash
        - nif
        - tipo
        - ativo
      properties:
        _id:
          type: string
          description: Identificador único do utilizador (gerado automaticamente pelo MongoDB).
        nome:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "jdoe@exemplo.pt"
        telefone:
          type: string
          example: "912345678"
        passwordHash:
          type: string
          format: password
          description: Apenas usada no registo/login.
        nif:
          type: string
          example: "123456789"
          description: Número de identificação fiscal.
        tipo:
          type: string
          enum: [admin, cliente]
          default: cliente
        ativo:
          type: boolean
          default: true

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          example: "jdoe2026@gmail.com"
        password:
          type: string
          format: password
          example: "senha123"

paths:
  /login:
    post:
      summary: Autentica o utilizador e cria sessão
      tags: [Autenticação]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login com sucesso. Retorna token e define cookie.
        '401':
          description: Credenciais inválidas.

  /logout:
    get:
      summary: Termina a sessão do utilizador
      tags: [Autenticação]
      responses:
        '200':
          description: Cookie de sessão removido.

  /users:
    get:
      summary: Lista todos os utilizadores
      tags: [Utilizadores]
      security:
        - bearerAuth: []
        - cookieAuth: []
        - queryAuth: []
      parameters:
        - in: query
          name: tipo
          schema:
            type: string
            enum: [admin, cliente]
          description: Filtra utilizadores por tipo.
        - in: query
          name: searchField
          schema:
            type: string
            enum: [nome, email, telefone, nif]
          description: Campo onde a pesquisa será aplicada.
        - in: query
          name: search
          schema:
            type: string
          description: Texto de pesquisa parcial.
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Número da página.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
          description: Número de registos por página.
        - in: query
          name: sort
          schema:
            type: string
          description: Ordenação passada ao Mongoose (ex. nome, -nome).
      responses:
        '200':
          description: Lista de utilizadores (sem passwords).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: Regista um novo utilizador
      tags: [Utilizadores]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: Utilizador criado com sucesso.

  /users/{id}:
    get:
      summary: Obtém detalhes de um utilizador específico
      tags: [Utilizadores]
      security:
        - bearerAuth: []
        - cookieAuth: []
        - queryAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dados do utilizador.
        '404':
          description: Utilizador não encontrado.
    put:
      summary: Atualiza os dados de um utilizador
      tags: [Utilizadores]
      security:
        - bearerAuth: []
        - cookieAuth: []
        - queryAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Dados atualizados.

  /users/{id}/deactivate:
    post:
      summary: Desativa um utilizador
      tags: [Utilizadores]
      security:
        - bearerAuth: []
        - cookieAuth: []
        - queryAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Utilizador desativado com sucesso.
        '404':
          description: Utilizador não encontrado.
          